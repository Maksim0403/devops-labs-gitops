apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: logiflow
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Maksim0403/devops-labs-gitops.git
    targetRevision: main
    path: charts/logiflow
    helm:
      valueFiles:
        - values-minikube.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: logiflow-argo
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true
