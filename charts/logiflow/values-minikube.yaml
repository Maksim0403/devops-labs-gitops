images:
  backend:
    repository: ghcr.io/maksim0403/devops-labs-backend
    tag: "2.0.0"
    pullPolicy: IfNotPresent
  frontend:
    repository: ghcr.io/maksim0403/devops-labs-frontend
    tag: "1.2.0"
    pullPolicy: IfNotPresent

existingSecret: logiflow-secret

env:
  - name: FAIL_RATE
    value: "0"

metrics:
  enabled: true

dashboard:
  enabled: true

alert:
  enabled: true
  errorRate: 0.05
  for: 30s

rollout:
  enabled: true
  analysis:
    enabled: true
    prometheusAddress: http://kps-prometheus.monitoring:9090
    selector: 'namespace="logiflow-argo"'
  strategy:
    canary:
      steps:
        - setWeight: 20
        - pause:
            duration: 30s
        - analysis:
            templates:
              - templateName: logiflow-logiflow-success-rate
        - setWeight: 60
        - pause:
            duration: 30s

backend:
  replicas: 5
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 300m
      memory: 384Mi

frontend:
  replicas: 1
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 96Mi

postgres:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 384Mi

ingress:
  enabled: false
